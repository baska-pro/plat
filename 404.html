<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ebe4d2">
  <title>404 - Plat tidak ditemukan | CekPlat</title>
  <link rel="icon" href="/plat/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --paper: #ebe4d2; --card: #f8f3e5; --ink: #16130d; --ink-2: #51493a; --signal: #ffc800; --red: #b32f14; }
    @media (prefers-color-scheme: dark) { :root { --paper: #131311; --card: #1d1d1a; --ink: #f1ebd9; --ink-2: #b5ad98; --red: #ff6a49; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 520px; width: 100%; }
    .plate { display: inline-block; background: #f4f0e4; color: #101010; border: 6px solid #101010; border-radius: 14px; box-shadow: 8px 8px 0 #101010; padding: 10px 26px 4px; transform: rotate(-2deg);
      font: 800 clamp(48px, 15vw, 84px)/1 "Arial Narrow", "Roboto Condensed", Impact, sans-serif; letter-spacing: .04em; }
    .plate small { display: block; border-top: 4px solid #101010; margin-top: 6px; padding: 4px 0 6px; font: 600 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em; text-align: center; }
    h1 { font: 800 clamp(30px, 8vw, 44px)/1.05 "Arial Narrow", "Roboto Condensed", Impact, sans-serif; text-transform: uppercase; margin: 34px 0 10px; }
    p { color: var(--ink-2); margin: 0 0 22px; }
    a { display: inline-block; background: var(--signal); color: #16130d; font: 700 16px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; text-decoration: none; padding: 14px 20px; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
    a:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="plate" role="img" aria-label="Plat 404">404<small>TIDAK TERDAFTAR</small></div>
    <h1>Plat ini tidak ada di sini</h1>
    <p>Halaman yang Anda cari tidak ditemukan. Mungkin tautannya salah ketik atau sudah dipindahkan.</p>
    <a href="/plat/">Kembali ke CekPlat</a>
  </main>
</body>
</html>
