name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil catatan rilis dari CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Tidak ada catatan untuk $version di CHANGELOG.md" >&2; exit 1; fi
          cat notes.md
      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "CekPlat ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
